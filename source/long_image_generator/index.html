<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>长图生成器</title>
<link rel="stylesheet" href="common.css">
</head>
<body>
<div class="mod-header">
  <div class="icon">🖼️</div>
  <h2>长图生成器</h2>
  <p>文本、Word 文档、网页和 HTML 内容，一句话转成 1080px 宽 PNG 长图。</p>
  <p class="mt-8"><span class="badge">文本</span> <span class="badge">DOCX</span> <span class="badge">网页</span></p>
</div>
<div class="info-card">
  <h3>支持输入</h3>
  <div class="feature-grid">
    <div class="feature-item"><span class="emoji">📝</span>纯文本 / Markdown</div>
    <div class="feature-item"><span class="emoji">📄</span>Word DOCX</div>
    <div class="feature-item"><span class="emoji">🌐</span>网页 URL / HTML</div>
    <div class="feature-item"><span class="emoji">🧾</span>报告 / 文章 / 摘录</div>
  </div>
</div>
<div class="info-card">
  <h3>接口</h3>
  <ul class="api-list">
    <li><span class="api-name">renderInputToImage</span><span>输入内容转长图</span></li>
    <li><span class="api-name">saveLongImage</span><span>分段内容保存长图</span></li>
    <li><span class="api-name">extractInputText</span><span>提取可渲染文本</span></li>
    <li><span class="api-name">formatShareText</span><span>整理分享文案</span></li>
  </ul>
</div>
</body>
</html>
