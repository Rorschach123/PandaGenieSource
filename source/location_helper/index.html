<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>位置助手</title>
  <style>
    :root { color-scheme: light; --green:#1f7a57; --bg:#f6f8f5; --card:#fff; --muted:#66706a; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--bg); color:#17211b; }
    main { max-width: 760px; margin: 0 auto; padding: 22px 16px 32px; }
    .hero { background: linear-gradient(135deg, #1f7a57, #46b07a); color:white; border-radius: 18px; padding: 22px; box-shadow: 0 10px 28px rgba(31,122,87,.18); }
    h1 { margin:0 0 8px; font-size: 28px; }
    .hero p { margin:0; opacity:.92; line-height:1.6; }
    .card { margin-top:16px; padding:18px; background:var(--card); border:1px solid rgba(31,122,87,.12); border-radius:16px; box-shadow:0 8px 24px rgba(0,0,0,.05); }
    h2 { margin:0 0 10px; font-size:20px; }
    .muted { color:var(--muted); line-height:1.6; }
    .grid { display:grid; gap:10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-top:14px; }
    .pill { padding:12px; border-radius:14px; background:#edf7f1; color:#15583f; font-weight:700; }
    code { background:#eef2ef; padding:2px 6px; border-radius:6px; }
  </style>
</head>
<body>
<main>
  <section class="hero">
    <h1>位置助手</h1>
    <p>获取当前城市、国家、详细地址、经纬度、海拔、定位精度和更新时间。</p>
  </section>
  <section class="card">
    <h2>一句话使用</h2>
    <p class="muted">在对话里说：<code>我现在在哪个城市？</code>、<code>获取我当前经纬度和海拔</code>、<code>Where am I now?</code></p>
    <div class="grid">
      <div class="pill">国家 / 城市</div>
      <div class="pill">经纬度</div>
      <div class="pill">海拔 / 精度</div>
      <div class="pill">地址反查</div>
    </div>
  </section>
  <section class="card">
    <h2>接口</h2>
    <p class="muted"><code>getCurrentLocation</code> 获取当前位置；<code>reverseGeocode</code> 根据经纬度反查地址。</p>
  </section>
</main>
</body>
</html>
