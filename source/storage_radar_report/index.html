<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>存储雷达报告</title>
<link rel="stylesheet" href="common.css">
</head>
<body>
<div class="mod-header">
  <div class="icon">📡</div>
  <h2>存储雷达报告</h2>
  <p>告诉用户空间到底去哪了，而不是盲目清缓存。</p>
  <p class="mt-8"><span class="badge">大文件 · APK · 视频 · 压缩包</span></p>
</div>
<div class="info-card">
  <h3>扫描重点</h3>
  <div class="feature-grid">
    <div class="feature-item"><span class="emoji">🎬</span>视频占用</div>
    <div class="feature-item"><span class="emoji">📦</span>压缩包</div>
    <div class="feature-item"><span class="emoji">🤖</span>APK 安装包</div>
    <div class="feature-item"><span class="emoji">⬇️</span>下载目录</div>
    <div class="feature-item"><span class="emoji">💬</span>微信目录</div>
    <div class="feature-item"><span class="emoji">🧬</span>疑似重复</div>
  </div>
</div>
<div class="info-card">
  <h3>接口</h3>
  <ul class="api-list">
    <li><span class="api-name">scanStorageRadar</span><span>扫描并生成报告</span></li>
    <li><span class="api-name">generateCleanupPlan</span><span>生成清理计划</span></li>
  </ul>
</div>
</body>
</html>
