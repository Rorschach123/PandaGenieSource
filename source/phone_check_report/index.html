<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>机圈验机报告</title>
<link rel="stylesheet" href="common.css">
</head>
<body>
<div class="mod-header">
  <div class="icon">✅</div>
  <h2>机圈验机报告</h2>
  <p>一句话生成新机、二手机、刷机后的手机体检报告。</p>
  <p class="mt-8"><span class="badge">酷安分享向</span></p>
</div>
<div class="info-card">
  <h3>核心能力</h3>
  <div class="feature-grid">
    <div class="feature-item"><span class="emoji">📱</span>设备/系统</div>
    <div class="feature-item"><span class="emoji">🖥️</span>屏幕参数</div>
    <div class="feature-item"><span class="emoji">🔋</span>电池温度</div>
    <div class="feature-item"><span class="emoji">📷</span>Camera2</div>
    <div class="feature-item"><span class="emoji">🔐</span>Widevine</div>
    <div class="feature-item"><span class="emoji">💾</span>存储测速</div>
  </div>
</div>
<div class="info-card">
  <h3>接口</h3>
  <ul class="api-list">
    <li><span class="api-name">generateInspectionReport</span><span>验机总报告</span></li>
    <li><span class="api-name">runStorageSpeedTest</span><span>轻量存储测速</span></li>
    <li><span class="api-name">getDeviceArchive</span><span>读取最近报告</span></li>
  </ul>
</div>
<div class="info-card">
  <h3>示例</h3>
  <ul class="example-list">
    <li>帮我做一次新机验机，生成酷安发帖报告</li>
    <li>二手机到手验机报告</li>
    <li>刷机后帮我复测手机状态</li>
  </ul>
</div>
</body>
</html>
